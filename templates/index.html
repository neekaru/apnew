<p><strong><span style="font-size:48px">SELAMAT DATANG DI TEST API</span></strong></p>

<p><span style="font-size:18px">Jadi sementara anda menunggu dulu ya selama 30 detik</span></p>
<br>
<div id="timeX"></div>
<div id="ping"></div>

<script>
var timeLeft = 30;
    var elem = document.getElementById('timeX');

    var timerId = setInterval(countdown, 1000);

    function countdown() {
        if (timeLeft == -1) {
          clearTimeout(timerId);
          setTimeout(redirect(), 0);
        } else {
          elem.innerHTML = timeLeft + ' Sisa Waktu';
          timeLeft--;
        }
      }

    function redirect() {
        document.getElementById("ping").innerHTML = "Your Time is Out Now Try again";
        windows.location.replace("https://www.youtube.com/watch?v=ZAn3JdtSrnY");
    }
</script>
